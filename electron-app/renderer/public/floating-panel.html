<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
#panel {
  width: 100%;
  height: 100%;
  padding: 16px 18px 15px;
  border-radius: 26px;
  /* Liquid Glass 的降级版：透明窗口里 backdrop-filter 看不到窗口后面的内容，所以用偏实的白色填充 + 高光边 + 阴影来表现玻璃。 */
  border: 1px solid rgba(255,255,255,0.75);
  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,249,252,0.92));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 14px 34px rgba(30,40,70,0.20), 0 3px 10px rgba(30,40,70,0.10);
  color: #2f3135;
}
.panel-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  height: 100%;
}
.hint-title {
  font-size: 16px;
  line-height: 1.25;
  font-weight: 500;
  letter-spacing: 0;
}
.hint-text {
  margin-top: 8px;
  max-width: 352px;
  font-size: 13px;
  line-height: 1.55;
  color: #656a72;
}
.chips {
  display: flex;
  gap: 8px;
  row-gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.chip {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 0 12px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.80);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 2px 8px rgba(30,40,70,0.10);
  color: #3f4349;
  font-size: 13px;
  line-height: 1;
}
.dismiss {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #8b8f96;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}
.dismiss:hover {
  background: rgba(119,119,119,0.08);
  color: #555b61;
}
.result-actions {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}
.icon-button {
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #8b8f96;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-button:hover:not(:disabled) {
  background: rgba(119,119,119,0.08);
  color: #555b61;
}
.icon-button:disabled {
  cursor: default;
  color: rgba(139,143,150,0.42);
}
.copy-icon {
  position: relative;
  display: inline-block;
  width: 16px;
  height: 16px;
}
.copy-icon::before,
.copy-icon::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 11px;
  border: 1.6px solid currentColor;
  border-radius: 1.5px;
  background: transparent;
}
.copy-icon::before {
  left: 3px;
  top: 3px;
}
.copy-icon::after {
  left: 6px;
  top: 0;
  background: rgba(250,251,253,0.96);
}
.result-text {
  flex: 1;
  max-height: 100%;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 14px;
  line-height: 1.55;
  color: #2f3135;
  padding-right: 2px;
}
.hidden {
  display: none;
}
</style>
</head>
<body>
<div id="panel">
  <div id="shortcut-view" class="panel-row">
    <div>
      <div class="hint-title">检测到长按快捷键</div>
      <div id="shortcut-hint-text" class="hint-text">长按 Right Alt 不会开始语音输入。请短按 Right Alt，或使用 Right Alt + Space / Right Alt + Right Shift。</div>
      <div class="chips">
        <span id="shortcut-dictation-chip" class="chip">Right Alt</span>
        <span id="shortcut-ask-chip" class="chip">Right Alt + Space</span>
        <span id="shortcut-translate-chip" class="chip">Right Alt + Right Shift</span>
      </div>
    </div>
    <button class="dismiss" type="button" aria-label="关闭提示">×</button>
  </div>

  <div id="result-view" class="panel-row hidden">
    <div id="result-text" class="result-text"></div>
    <div class="result-actions">
      <button id="copy-result" class="icon-button" type="button" aria-label="复制结果" title="复制结果" disabled>
        <span class="copy-icon" aria-hidden="true"></span>
      </button>
      <button class="dismiss" type="button" aria-label="关闭结果">×</button>
    </div>
  </div>
</div>
<script>
const shortcutView = document.getElementById('shortcut-view');
const resultView = document.getElementById('result-view');
const resultText = document.getElementById('result-text');
const copyResultButton = document.getElementById('copy-result');
let currentResultText = '';

function applyShortcutLabels() {
  const isMacOS = window.ipcRenderer && window.ipcRenderer.platform === 'darwin';
  if (!isMacOS) return;

  document.getElementById('shortcut-hint-text').textContent = '长按 Right Option 不会开始语音输入。请短按 Right Option，或使用 Right Option + Right Command / Right Option + Shift。';
  document.getElementById('shortcut-dictation-chip').textContent = 'Right Option';
  document.getElementById('shortcut-ask-chip').textContent = 'Right Option + Right Command';
  document.getElementById('shortcut-translate-chip').textContent = 'Right Option + Shift';
}

function closeFloatingPanel() {
  if (window.ipcRenderer) {
    window.ipcRenderer.send('floating-panel', { visible: false });
  }
}

function renderFloatingPanel(payload) {
  const panelType = payload && payload.type === 'free-ask-result' ? 'free-ask-result' : 'shortcut-hint';

  if (panelType === 'free-ask-result') {
    currentResultText = typeof payload.text === 'string' ? payload.text : '';
    shortcutView.classList.add('hidden');
    resultView.classList.remove('hidden');
    resultText.textContent = currentResultText;
    copyResultButton.disabled = !currentResultText;
    return;
  }

  currentResultText = '';
  resultView.classList.add('hidden');
  shortcutView.classList.remove('hidden');
  resultText.textContent = '';
  copyResultButton.disabled = true;
}

async function writeClipboardText(text) {
  if (!text) return false;
  if (window.ipcRenderer && typeof window.ipcRenderer.invoke === 'function') {
    try {
      const result = await window.ipcRenderer.invoke('clipboard:write-text', text);
      if (result === true || result?.success === true) return true;
    } catch (_error) {
      // 主进程剪贴板失败时再尝试浏览器剪贴板，成功后才关闭面板。
    }
  }
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_error) {
      return false;
    }
  }
  return false;
}

Array.from(document.querySelectorAll('.dismiss')).forEach((button) => {
  button.addEventListener('click', closeFloatingPanel);
});

copyResultButton.addEventListener('click', async () => {
  const copied = await writeClipboardText(currentResultText);
  if (copied) closeFloatingPanel();
});

if (window.ipcRenderer) {
  window.ipcRenderer.on('floating-panel', (_event, payload) => renderFloatingPanel(payload));
}

applyShortcutLabels();
renderFloatingPanel({ visible: true, type: 'shortcut-hint' });
</script>
</body>
</html>
